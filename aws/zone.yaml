AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  clarv.in DNS on Route 53. Carries the iCloud+ mail records exactly as they stand at Squarespace, so mail keeps
  working through the nameserver change. The site records point at GitHub Pages until the CloudFront stack exists
  (SiteTarget=github), then at CloudFront (SiteTarget=cloudfront). Route 53 is global; the stack itself is deployed in
  ap-southeast-2, the only region this project's organisation policy admits for CloudFormation.

Parameters:
  DomainName:
    Type: String
    Default: clarv.in
  SiteTarget:
    Type: String
    AllowedValues: [github, cloudfront]
    Default: github
    Description: github while the site is still on GitHub Pages; cloudfront once site.yaml is deployed.
  CloudFrontDomain:
    Type: String
    Default: ""
    Description: The DistributionDomain output of site.yaml (e.g. d1234abcd.cloudfront.net). Needed for SiteTarget=cloudfront.
  AppIp:
    Type: String
    Default: ""
    Description: The Clarv application's Elastic IP (the clarv stack's PublicIp). Empty leaves app.clarv.in out.
  AppleDomainCode:
    Type: String
    Default: apple-domain=NxhVtq4lfs5ZeyXJ
    Description: iCloud+ custom-domain verification TXT, as read from the live zone on 4 Oct 2026.
  CertValidation1Name:
    Type: String
    Default: ""
    Description: ACM's DNS validation CNAME name for the certificate (aws acm describe-certificate --region us-east-1).
  CertValidation1Value:
    Type: String
    Default: ""
  CertValidation2Name:
    Type: String
    Default: ""
    Description: The second validation CNAME, where ACM gives www.clarv.in its own; empty when it shares the first.
  CertValidation2Value:
    Type: String
    Default: ""
  WwwStage:
    Type: String
    AllowedValues: [records, none]
    Default: records
    Description: none only for the one update that removes the old www CNAME before its replacement is written.

Conditions:
  OnGithub: !Equals [!Ref SiteTarget, github]
  HasWww: !Equals [!Ref WwwStage, records]
  OnCloudFront: !Equals [!Ref SiteTarget, cloudfront]
  HasApp: !Not [!Equals [!Ref AppIp, ""]]
  HasCert1: !Not [!Equals [!Ref CertValidation1Name, ""]]
  HasCert2: !Not [!Equals [!Ref CertValidation2Name, ""]]

Resources:
  Zone:
    Type: AWS::Route53::HostedZone
    Properties:
      Name: !Ref DomainName
      HostedZoneConfig:
        Comment: clarv.in public zone (site, app and iCloud mail)

  Mail:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref Zone
      Name: !Ref DomainName
      Type: MX
      TTL: "3600"
      ResourceRecords:
        - 10 mx01.mail.icloud.com.
        - 10 mx02.mail.icloud.com.

  Txt:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref Zone
      Name: !Ref DomainName
      Type: TXT
      TTL: "3600"
      ResourceRecords:
        - '"v=spf1 include:icloud.com ~all"'
        - !Sub '"${AppleDomainCode}"'

  Dkim:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref Zone
      Name: !Sub sig1._domainkey.${DomainName}
      Type: CNAME
      TTL: "3600"
      ResourceRecords:
        - !Sub sig1.dkim.${DomainName}.at.icloudmailadmin.com.

  # The four site records. Each is ONE record whose target follows SiteTarget, so moving from GitHub Pages to
  # CloudFront is an in-place UPSERT with no gap: separate GitHub and CloudFront records for the same name and
  # type cannot be swapped in one update (CloudFormation creates the new before deleting the old, and Route 53
  # refuses two A records for one name). The logical ids keep the names they were created under (ApexGithub…),
  # because renaming one makes CloudFormation replace it.
  ApexGithub:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref Zone
      Name: !Ref DomainName
      Type: A
      TTL: !If [OnGithub, "300", !Ref "AWS::NoValue"]
      ResourceRecords: !If [OnGithub, [185.199.108.153, 185.199.109.153, 185.199.110.153, 185.199.111.153], !Ref "AWS::NoValue"]
      AliasTarget: !If [OnCloudFront, { DNSName: !Ref CloudFrontDomain, HostedZoneId: Z2FDTNDATAQYW2 }, !Ref "AWS::NoValue"]

  ApexGithub6:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref Zone
      Name: !Ref DomainName
      Type: AAAA
      TTL: !If [OnGithub, "300", !Ref "AWS::NoValue"]
      ResourceRecords: !If [OnGithub, ["2606:50c0:8000::153"], !Ref "AWS::NoValue"]
      AliasTarget: !If [OnCloudFront, { DNSName: !Ref CloudFrontDomain, HostedZoneId: Z2FDTNDATAQYW2 }, !Ref "AWS::NoValue"]

  # www points at GitHub Pages by its addresses, never by a CNAME to guptaujjwal01.github.io: a CNAME carries
  # github.io's CAA records (Let's Encrypt, Sectigo, DigiCert only) and ACM refused www.clarv.in with CAA_ERROR
  # on 4 Oct 2026. WwwStage=none removed the old CNAME for one update, because a CNAME cannot be swapped in place.
  WwwGithubA:
    Type: AWS::Route53::RecordSet
    Condition: HasWww
    Properties:
      HostedZoneId: !Ref Zone
      Name: !Sub www.${DomainName}
      Type: A
      TTL: !If [OnGithub, "300", !Ref "AWS::NoValue"]
      ResourceRecords: !If [OnGithub, [185.199.108.153, 185.199.109.153, 185.199.110.153, 185.199.111.153], !Ref "AWS::NoValue"]
      AliasTarget: !If [OnCloudFront, { DNSName: !Ref CloudFrontDomain, HostedZoneId: Z2FDTNDATAQYW2 }, !Ref "AWS::NoValue"]

  WwwGithubAAAA:
    Type: AWS::Route53::RecordSet
    Condition: HasWww
    Properties:
      HostedZoneId: !Ref Zone
      Name: !Sub www.${DomainName}
      Type: AAAA
      TTL: !If [OnGithub, "300", !Ref "AWS::NoValue"]
      ResourceRecords: !If [OnGithub, ["2606:50c0:8000::153"], !Ref "AWS::NoValue"]
      AliasTarget: !If [OnCloudFront, { DNSName: !Ref CloudFrontDomain, HostedZoneId: Z2FDTNDATAQYW2 }, !Ref "AWS::NoValue"]

  App:
    Type: AWS::Route53::RecordSet
    Condition: HasApp
    Properties:
      HostedZoneId: !Ref Zone
      Name: !Sub app.${DomainName}
      Type: A
      TTL: "300"
      ResourceRecords: [!Ref AppIp]

  CertCheck1:
    Type: AWS::Route53::RecordSet
    Condition: HasCert1
    Properties:
      HostedZoneId: !Ref Zone
      Name: !Ref CertValidation1Name
      Type: CNAME
      TTL: "300"
      ResourceRecords: [!Ref CertValidation1Value]

  CertCheck2:
    Type: AWS::Route53::RecordSet
    Condition: HasCert2
    Properties:
      HostedZoneId: !Ref Zone
      Name: !Ref CertValidation2Name
      Type: CNAME
      TTL: "300"
      ResourceRecords: [!Ref CertValidation2Value]

Outputs:
  HostedZoneId:
    Value: !Ref Zone
  NameServers:
    Description: Put these four at Squarespace (Domains > clarv.in > DNS > Nameservers > use custom nameservers).
    Value: !Join [", ", !GetAtt Zone.NameServers]
